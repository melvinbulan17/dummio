name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm zip
      - run: pnpm zip:firefox
      - run: |
          cp .output/*-chrome.zip dummio-chrome.zip
          cp .output/*-firefox.zip dummio-firefox.zip
          gh release create "$GITHUB_REF_NAME" dummio-chrome.zip dummio-firefox.zip \
            --title "Dummio ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
